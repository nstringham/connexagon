name: Pull Requests

on:
  pull_request_target:
    branches:
      - next

permissions:
  pull-requests: read

jobs:
  prevent-file-change:
    name: Prevent Migration Edits
    runs-on: ubuntu-latest
    steps:
      - uses: xalvarez/prevent-file-change-action@8ba6c9f0f3c6c73caea35ae4b13988047f9cd104
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          pattern: supabase/migrations/.*
          allowNewFiles: true
